name: Build and Push Image

on:
  push:
    branches: [main]
    paths-ignore:
      - 'helm/**'
      - '**.md'
      - '.github/workflows/helm-*.yaml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'helm/**'
      - '**.md'
      - '.github/workflows/helm-*.yaml'
  workflow_dispatch:

permissions:
  contents: write        # push git tags
  security-events: write # upload sarif to GitHub Security tab

env:
  IMAGE: balman/otel-demo

jobs:
  scan-code:
    name: code scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0

      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go vet ./...

      - uses: golang/govulncheck-action@v1.0.4

  build:
    name: build, scan & push
    runs-on: ubuntu-latest
    needs: scan-code
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: compute version
        id: version
        run: |
          BASE=$(git tag --list 'v*' --sort=-version:refname | head -1)
          BASE=${BASE:-v0.0.0}
          MAJOR=$(echo $BASE | cut -d. -f1 | tr -d v)
          MINOR=$(echo $BASE | cut -d. -f2)
          PATCH=$(echo $BASE | cut -d. -f3)
          [[ "${{ github.event_name }}" != "pull_request" ]] && PATCH=$((PATCH + 1))
          echo "version=v${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3.10.0

      - name: login to docker hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false  # not supported with load=true

      - name: trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL
          exit-code: 0
          trivy-flags: --skip-version-check

      - name: upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3.28.18
        with:
          sarif_file: trivy-results.sarif

      - name: push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha  # reuses the layer cache from build above
          provenance: true
          sbom: true

  release:
    name: tag release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5.0.0

      - name: create github release
        run: |
          gh release create ${{ needs.build.outputs.version }} \
            --title "${{ needs.build.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
